<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Suorena Saeidi — Data × AI × Control</title>
  <desc id="desc">A dark technical interface connecting decision systems and precision motion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090e"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#120c1d"/>
    </linearGradient>
    <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69f0ff"/>
      <stop offset="0.55" stop-color="#8ea0ff"/>
      <stop offset="1" stop-color="#c58cff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6728"/>
      <stop offset="1" stop-color="#f3c969"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>

  <g opacity=".85">
    <circle cx="980" cy="170" r="112" fill="none" stroke="#6ceeff" stroke-opacity=".20"/>
    <circle cx="980" cy="170" r="79" fill="none" stroke="#c58cff" stroke-opacity=".18" stroke-dasharray="4 10"/>
    <circle cx="980" cy="170" r="44" fill="#0d1524" stroke="url(#cyanViolet)" stroke-width="1.5"/>
    <circle cx="980" cy="170" r="7" fill="#7cecff" filter="url(#glow)"/>
    <path d="M868 170h-74c-32 0-48-20-48-48v-4" fill="none" stroke="#69f0ff" stroke-opacity=".55"/>
    <path d="M1092 170h52c22 0 33 13 33 33v10" fill="none" stroke="#c58cff" stroke-opacity=".55"/>
    <circle cx="792" cy="118" r="4" fill="#69f0ff"/>
    <circle cx="1145" cy="214" r="4" fill="#c58cff"/>
    <rect x="744" y="77" width="96" height="24" rx="12" fill="#0b1620" stroke="#69f0ff" stroke-opacity=".32"/>
    <text x="792" y="93" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.4" fill="#90f5ff">DECISION</text>
    <rect x="1095" y="236" width="96" height="24" rx="12" fill="#161020" stroke="#c58cff" stroke-opacity=".32"/>
    <text x="1143" y="252" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.4" fill="#d9b8ff">MOTION</text>
    <text x="980" y="166" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="2" fill="#a5afc6">OBSERVE</text>
    <text x="980" y="181" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="2" fill="#f2f5fb">MODEL · ACT</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="78" font-size="14" letter-spacing="3.6" fill="#82edf8">SUORENA SAEIDI</text>
    <text x="72" y="137" font-size="48" font-weight="700" fill="#f4f7fb">Data × AI × Control</text>
    <rect x="72" y="160" width="480" height="2" rx="1" fill="url(#cyanViolet)"/>
    <text x="72" y="205" font-size="22" fill="#cbd3e1">I build intelligence that moves</text>
    <text x="72" y="235" font-size="22" fill="#ffffff">decisions — and machines.</text>
    <text x="72" y="286" font-size="12" letter-spacing="1.8" fill="#8691a6">DATA SCIENCE LEAD EXPERT · PHD RESEARCHER</text>
    <rect x="72" y="305" width="132" height="3" rx="1.5" fill="url(#gold)" opacity=".9"/>
  </g>
</svg>